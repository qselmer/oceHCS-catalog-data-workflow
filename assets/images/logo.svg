<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 420" role="img" aria-labelledby="title desc">
  <title id="title">Humboldt Current environmental data workflow</title>
  <desc id="desc">Circular marine data emblem with ocean currents, a data cube, and a validation check.</desc>

  <defs>
    <linearGradient id="sea" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#166FA7"/>
      <stop offset="100%" stop-color="#2AA7A1"/>
    </linearGradient>
  </defs>

  <circle cx="210" cy="210" r="202" fill="#FFFFFF"/>
  <circle cx="210" cy="210" r="184" fill="none" stroke="#0B2F5B" stroke-width="14"/>

  <!-- Stylized HCS coastline -->
  <path d="M307 83
           C288 111 296 137 278 162
           C262 184 272 211 255 232
           C239 252 247 279 227 303
           C218 315 211 326 207 339"
        fill="none" stroke="#0B2F5B" stroke-width="13" stroke-linecap="round"/>

  <!-- Northward Humboldt Current -->
  <path d="M184 321
           C146 293 132 255 139 216
           C146 175 169 139 199 110"
        fill="none" stroke="url(#sea)" stroke-width="18" stroke-linecap="round"/>
  <path d="M198 109 L177 122 L195 86 L218 116 Z" fill="#2AA7A1"/>

  <!-- Data cube -->
  <g stroke="#0B2F5B" stroke-width="9" stroke-linejoin="round">
    <path d="M183 176 L230 151 L277 176 L230 201 Z" fill="#DDEFF4"/>
    <path d="M183 176 L230 201 L230 258 L183 231 Z" fill="#2AA7A1"/>
    <path d="M230 201 L277 176 L277 231 L230 258 Z" fill="#2B86BC"/>
  </g>

  <!-- Grid cells -->
  <g stroke="#FFFFFF" stroke-width="4" opacity="0.95">
    <line x1="207" y1="189" x2="207" y2="245"/>
    <line x1="253" y1="188" x2="253" y2="244"/>
    <line x1="187" y1="204" x2="230" y2="228"/>
    <line x1="230" y1="228" x2="273" y2="204"/>
  </g>

  <!-- Validation mark -->
  <circle cx="303" cy="290" r="43" fill="#FFFFFF" stroke="#0B2F5B" stroke-width="10"/>
  <path d="M282 291 L298 307 L326 273" fill="none" stroke="#2AA7A1" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Ocean layers -->
  <path d="M74 291 C124 259 164 267 206 292 C247 316 286 314 346 279" fill="none" stroke="#2AA7A1" stroke-width="11" stroke-linecap="round"/>
  <path d="M72 319 C125 287 165 296 207 319 C250 342 293 337 349 307" fill="none" stroke="#166FA7" stroke-width="11" stroke-linecap="round"/>
</svg>
