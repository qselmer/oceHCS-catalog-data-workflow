    record_provider_license_and_access_date: true
    keep_raw_files_immutable: true
    preserve_native_resolution: true

  candidate_providers:
    copernicus_marine:
      enabled: true
      products: []
    era5:
      enabled: true
      products: []
    gebco:
      enabled: true
